<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Console — Tenancy Dashboard</title>
<style>
:root {
  --red:#c74634; --ink:#161513; --muted:#6b6560; --line:#e6e2dc; --bg:#f6f5f3;
  --ok:#1b7a4a; --ok-bg:#e7f6ee; --stop:#8a3a32; --stop-bg:#fdecea; --warn:#9a6700; --warn-bg:#fff6e0; --blue:#1f4e8c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-rows:56px 1fr;grid-template-columns:228px 1fr;grid-template-areas:"top top" "side main"}
header{grid-area:top;background:#1c1917;color:#fff;display:flex;align-items:center;gap:18px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.mark{width:28px;height:28px;border-radius:7px;background:#c74634;display:grid;place-items:center;font-weight:800;font-size:12px}
.crumb{color:#c8c2bb;font-size:13px}.crumb b{color:#fff}
.hdr-sp,.sp{flex:1}
.region,.avatar{background:#2c2826;border:1px solid #3d3835;color:#eee;border-radius:8px;padding:6px 10px;font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700}
aside{grid-area:side;background:#fff;border-right:1px solid var(--line);padding:14px 10px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 6px}
.nav-btn{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.nav-btn.active,.nav-btn:hover{background:#f4efe9}
.nav-btn.active{font-weight:600;box-shadow:inset 3px 0 0 var(--red)}
main{grid-area:main;overflow:auto;padding:22px 28px 48px}
h1{font-size:22px;margin:0 0 4px} h3{margin:0 0 8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select,input,textarea{font:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn.primary{background:var(--red);border-color:#a33a2b;color:#fff}
.btn.danger{color:var(--stop)}
.btn:disabled{opacity:.55;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.search{min-width:220px;width:auto}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:10px}
.stat{padding:14px 16px;cursor:pointer}
.k{font-size:12px;color:var(--muted)}.v{font-size:24px;font-weight:700}
.panel{overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);padding:10px 14px;background:#faf9f7}
td{padding:12px 14px;border-top:1px solid #f0ece7;vertical-align:top}
tr.click:hover td{background:#fbf8f5;cursor:pointer}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.stop{background:var(--stop-bg);color:var(--stop)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.linkish{color:var(--blue);font-weight:600;cursor:pointer}
.mono{font-family:ui-monospace,monospace;font-size:12px}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13.5px}
.kv span{color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(22,21,19,.45);display:none;place-items:center;z-index:20;padding:16px}
.modal-bg.show{display:grid}
.modal{width:min(640px,100%);background:#fff;border-radius:14px}
.modal-h,.modal-f{padding:16px 18px;display:flex;align-items:center;gap:10px}
.modal-h{border-bottom:1px solid var(--line)}.modal-f{border-top:1px solid var(--line);justify-content:flex-end}
.modal-b{padding:16px 18px;display:grid;gap:12px}
label{font-size:12.5px;font-weight:600;display:grid;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:18px;right:18px;background:#1c1917;color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:30}
.toast.show{display:block}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{font-size:11px;background:#f4efe9;border-radius:6px;padding:2px 6px}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:auto}
.pad{padding:16px}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-areas:"top" "main"} aside{display:none}.cards,.grid2,.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">OC</div> Cloud Console</div>
  <div class="crumb">Tenancy / <b id="crumb">Dashboard</b></div>
  <div class="hdr-sp"></div>
  <div class="region" id="regionLabel">us-ashburn-1</div>
  <div class="avatar">AL</div>
</header>
<aside>
  <div class="nav-label">Home</div>
  <button class="nav-btn active" data-view="home">Dashboard</button>
  <div class="nav-label">Core</div>
  <button class="nav-btn" data-view="compute">Compute</button>
  <button class="nav-btn" data-view="database">Databases</button>
  <button class="nav-btn" data-view="storage">Object Storage</button>
  <button class="nav-btn" data-view="network">Networking</button>
  <button class="nav-btn" data-view="identity">Identity</button>
</aside>
<main id="app"></main>
<div class="modal-bg" id="modal"></div>
<div class="toast" id="toast"></div>
<script>
const REGIONS = ["us-ashburn-1", "us-phoenix-1", "eu-frankfurt-1", "uk-london-1"];
const TITLES = {home:"Dashboard", compute:"Compute", database:"Databases", storage:"Object Storage", network:"Networking", identity:"Identity"};
const state = {
  view: "home", region: "us-ashburn-1", q: "", detail: null,
  activity: [],
  compartments: ["prod-apps", "platform", "sandbox"],
  instances: [],
  dbs: [],
  buckets: [],
  vcns: [],
  users: [],
  groups: []
};

function id(prefix) {return prefix + Math.random().toString(36).slice(2, 10);}
function now() {return new Date().toISOString();}
function $(s, r = document) {return r.querySelector(s);}
function esc(s) {return String(s?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(iso) {return new Date(iso).toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});}
function inRegion(list) {return list.filter(x => x.region === state.region);}
function log(msg) {state.activity.unshift({msg, when: now()}); state.activity = state.activity.slice(0, 8);}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function pill(status) {
  const cls = /running|available|active/i.test(status)? "ok": /stopped|terminated/i.test(status)? "stop": "warn";
  return `<span class="pill ${cls}"><span class="dot"></span>${esc(status)}</span>`;
}
function ip() {return "10.0." + (1 + Math.floor(Math.random() *8)) + "." + (10 + Math.floor(Math.random()* 200));}

function seed() {
  const v = {id:id("vcn-"), name:"app-vcn", cidr:"10.0.0.0/16", region:state.region, compartment:"prod-apps", dns:"appvcn",
    subnets:[{id:id("sub-"), name:"app-private", cidr:"10.0.1.0/24", access:"Private"}],
    rules:[{id:id("sl-"), proto:"TCP", port:"22", cidr:"10.0.0.0/16", desc:"SSH from VCN"}]};
  state.vcns.push(v);
  state.instances.push({id:id("ocid1.instance."), name:"web-1", shape:"VM.Standard.E4.Flex", ocpu:1, mem:16, image:"Oracle Linux 8", status:"Running", region:state.region, compartment:"prod-apps", subnet:v.subnets[0].id, vcn:v.id, privateIp:ip(), created:now()});
  state.dbs.push({id:id("ocid1.autonomousdatabase."), name:"sales-adb", workload:"Transaction Processing", status:"Available", ocpu:2, storage:1, region:state.region, compartment:"prod-apps", created:now()});
  state.buckets.push({id:id("bkt-"), name:"app-assets", region:state.region, compartment:"prod-apps", access:"Private", created:now(), objects:[{name:"readme.txt", size:42, type:"text/plain", data:"Simulated object. Not stored in a cloud.", when:now()}]});
  state.users.push({id:id("usr-"), name:"alex.lee", email:"alex.lee@example.com", status:"Active", groups:["db-admins"]});
  state.users.push({id:id("usr-"), name:"sam.patel", email:"sam.patel@example.com", status:"Active", groups:["compute-ops"]});
  state.groups.push({id:id("grp-"), name:"db-admins", desc:"Database administrators"}, {id:id("grp-"), name:"compute-ops", desc:"Compute operators"});
  log("Console loaded in " + state.region);
}
seed();

function render() {
  $("#regionLabel").textContent = state.region;
  $("#crumb").textContent = TITLES[state.view] || "Details";
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === state.view));
  const views = {home:viewHome, compute:viewCompute, database:viewDb, storage:viewStorage, network:viewNet, identity:viewId};
  $("#app").innerHTML = (views[state.view] || viewHome)();
  bind();
}

function head(title, sub, action) {
  return `<div class="row" style="margin-bottom:14px"><div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="sp"></div>${action || ""}</div>`;
}
function regionSelect() {
  return `<select id="region">${REGIONS.map(r => `<option ${r===state.region?"selected":""}>${r}</option>`).join("")}</select>`;
}
function table(headers, rows, empty) {
  return `<div class="panel"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows || `<tr><td colspan="${headers.length}" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
}

function viewHome() {
  const cards = [
    ["Compute", inRegion(state.instances).length, "compute"],
    ["Databases", inRegion(state.dbs).length, "database"],
    ["Buckets", inRegion(state.buckets).length, "storage"],
    ["VCNs", inRegion(state.vcns).length, "network"]
];
  return `${head("Dashboard", "Local control-plane simulator for " + state.region + ". Nothing is provisioned in a real cloud.", regionSelect())}
    <div class="cards">${cards.map(c => `<div class="stat" data-go="${c[2]}"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`).join("")}</div>
    <div class="panel pad"><h3>Recent activity</h3>${state.activity.map(a => `<div class="row" style="padding:6px 0;border-top:1px solid #f0ece7"><span>${esc(a.msg)}</span><div class="sp"></div><span class="k">${fmt(a.when)}</span></div>`).join("")}</div>`;
}

function viewCompute() {
  const rows = inRegion(state.instances).filter(i => i.name.includes(state.q.toLowerCase())).map(i => `<tr class="click" data-kind="instance" data-id="${i.id}"><td class="linkish">${esc(i.name)}</td><td>${pill(i.status)}</td><td>${esc(i.shape)} · ${i.ocpu} OCPU</td><td class="mono">${i.privateIp}</td><td>${esc(i.compartment)}</td></tr>`).join("");
  const d = state.instances.find(x => x.id === state.detail);
  const detail = d? `<div class="panel pad" style="margin-top:14px"><div class="row"><h3 style="margin:0">${esc(d.name)}</h3><div class="sp"></div>${pill(d.status)}
      ${d.status==="Running"?`<button class="btn" id="stopI">Stop</button>`:`<button class="btn primary" id="startI">Start</button>`}
      <button class="btn danger" id="termI">Terminate</button></div>
      <div class="kv" style="margin-top:12px"><span>Shape</span><div>${esc(d.shape)}</div><span>Image</span><div>${esc(d.image)}</div><span>Private IP</span><div class="mono">${d.privateIp}</div><span>Public IP</span><div>None — private subnet</div><span>Created</span><div>${fmt(d.created)}</div></div></div>`: "";
  return `${head("Compute instances", "Virtual machines in " + state.region + ".", `<input class="search" id="q" placeholder="Filter name" value="${esc(state.q)}"><button class="btn primary" id="newI">Create instance</button>`)}
    ${table(["Name","State","Shape","Private IP","Compartment"], rows, "No instances in this region.")}${detail}`;
}

function viewDb() {
  const rows = inRegion(state.dbs).map(d => `<tr><td class="linkish" data-kind="db" data-id="${d.id}">${esc(d.name)}</td><td>${pill(d.status)}</td><td>${esc(d.workload)}</td><td>${d.ocpu}</td><td>${d.storage} TB</td><td><button class="btn" data-toggle-db="${d.id}">${d.status==="Available"?"Stop":"Start"}</button></td></tr>`).join("");
  return `${head("Autonomous Databases", "Same local database console, now inside the shell.", `<button class="btn primary" id="newDb">Create database</button>`)}
    ${table(["Name","State","Workload","OCPU","Storage",""], rows, "No databases in this region.")}`;
}

function viewStorage() {
  const b = state.buckets.find(x => x.id === state.detail && x.region === state.region) || inRegion(state.buckets)[0];
  if (b) state.detail = b.id;
  const list = inRegion(state.buckets).map(x => `<button class="btn ${b && x.id===b.id?"primary":""}" data-bucket="${x.id}">${esc(x.name)}</button>`).join("");
  const objs = b? b.objects.map((o, i) => `<tr><td>${esc(o.name)}</td><td>${o.size} B</td><td>${fmt(o.when)}</td><td><button class="btn" data-dl="${i}">Download</button> <button class="btn danger" data-del="${i}">Delete</button></td></tr>`).join(""): "";
  return `${head("Object Storage", "Buckets stay in this browser tab.", `<button class="btn primary" id="newB">Create bucket</button>`)}
    <div class="row" style="margin-bottom:12px">${list || "<span class='k'>No buckets.</span>"}</div>
    ${b? `<div class="panel pad"><div class="row"><b>${esc(b.name)}</b><span class="badge">${b.access}</span><div class="sp"></div><input type="file" id="file" style="width:auto"></div>
      ${table(["Object","Size","Uploaded",""], objs, "Bucket is empty.")}</div>`: ""}`;
}

function viewNet() {
  const rows = inRegion(state.vcns).map(v => `<tr class="click" data-kind="vcn" data-id="${v.id}"><td class="linkish">${esc(v.name)}</td><td class="mono">${v.cidr}</td><td>${v.subnets.length}</td><td>${v.rules.length}</td><td>${esc(v.compartment)}</td></tr>`).join("");
  const v = state.vcns.find(x => x.id === state.detail);
  const detail = v? `<div class="grid2" style="margin-top:14px">
      <div class="panel pad"><h3>Subnets</h3>${v.subnets.map(s => `<div class="row" style="padding:6px 0"><b>${esc(s.name)}</b><span class="mono">${s.cidr}</span><span class="badge">${s.access}</span></div>`).join("")}
        <button class="btn" id="addSub" style="margin-top:8px">Add subnet</button></div>
      <div class="panel pad"><h3>Security list</h3>${v.rules.map(r => `<div class="row" style="padding:6px 0"><span>${r.proto} ${esc(r.port)} from ${esc(r.cidr)}</span><div class="sp"></div><button class="btn danger" data-rule="${r.id}">Remove</button></div>`).join("")}
        <button class="btn" id="addRule" style="margin-top:8px">Add ingress rule</button></div></div>`: "";
  return `${head("Virtual cloud networks", "VCNs, subnets, and security lists in " + state.region + ".", `<button class="btn primary" id="newV">Create VCN</button>`)}
    ${table(["Name","CIDR","Subnets","Rules","Compartment"], rows, "No VCNs in this region.")}${detail}`;
}

function viewId() {
  const users = state.users.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${pill(u.status)}</td><td>${u.groups.map(g => `<span class="badge">${esc(g)}</span>`).join(" ") || "—"}</td><td><button class="btn danger" data-user="${u.id}">Remove</button></td></tr>`).join("");
  const groups = state.groups.map(g => `<tr><td>${esc(g.name)}</td><td>${esc(g.desc)}</td><td>${state.users.filter(u => u.groups.includes(g.name)).length}</td></tr>`).join("");
  return `${head("Identity", "Users and groups for this tenancy. Not a real IAM service.", `<button class="btn" id="newG">Create group</button><button class="btn primary" id="newU">Create user</button>`)}
    <div class="grid2"><div>${table(["User","Email","State","Groups",""], users, "No users.")}</div><div>${table(["Group","Description","Members"], groups, "No groups.")}</div></div>
    <p class="sub" style="margin-top:14px">Compartments: ${state.compartments.map(c => `<span class="badge">${c}</span>`).join(" ")}</p>`;
}

function openModal(html) {
  $("#modal").innerHTML = `<div class="modal">${html}</div>`;
  $("#modal").classList.add("show");
  $("#x") && ($("#x").onclick = closeModal);
  $("#cancel") && ($("#cancel").onclick = closeModal);
}
function closeModal() {$("#modal").classList.remove("show"); $("#modal").innerHTML = "";}
function field(label, id, value, type="text") {return `<label>${label}<input id="${id}" type="${type}" value="${esc(value || "")}"></label>`;}
function compSelect() {return `<label>Compartment<select id="comp">${state.compartments.map(c => `<option>${c}</option>`).join("")}</select></label>`;}

function createInstance() {
  const nets = inRegion(state.vcns);
  if (!nets.length) return toast("Create a VCN in this region first.");
  const subs = nets.flatMap(v => v.subnets.map(s => ({...s, vcn:v.id, label:v.name + " / " + s.name})));
  openModal(`<div class="modal-h"><h2>Create instance</h2><div class="sp"></div><button class="btn" id="x">Close</button></div>
    <div class="modal-b">${field("Name","n","app-server")}<div class="two"><label>Shape<select id="shape"><option>VM.Standard.E4.Flex</option><option>VM.Standard.A1.Flex</option></select></label><label>Image<select id="image"><option>Oracle Linux 8</option><option>Ubuntu 22.04</option></select></label></div>
    <div class="two">${field("OCPU","ocpu","1","number")}${field("Memory GB","mem","16","number")}</div>
    <label>Subnet<select id="sub">${subs.map(s => `<option value="${s.vcn}|${s.id}">${esc(s.label)}</option>`).join("")}</select></label>${compSelect()}</div>
    <div class="modal-f"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Create</button></div>`);
  $("#x").onclick = $("#cancel").onclick = closeModal;
  $("#go").onclick = () => {
    const name = $("#n").value.trim();
    if (!/^[a-zA-Z][\w-]{1,30}$/.test(name)) return toast("Use a short name starting with a letter.");
    const [vcn, subnet] = $("#sub").value.split("|");
    const inst = {id:id("ocid1.instance."), name, shape:$("#shape").value, ocpu:+$("#ocpu").value||1, mem:+$("#mem").value||16, image:$("#image").value, status:"Provisioning", region:state.region, compartment:$("#comp").value, subnet, vcn, privateIp:ip(), created:now()};
    state.instances.unshift(inst); closeModal(); log("Provisioning " + name); render();
    setTimeout(() => {inst.status = "Running"; log(name + " is Running"); toast(name + " is Running"); render();}, 900);
};
}

function createDb() {
  openModal(`<div class="modal-h"><h2>Create database</h2><div class="sp"></div><button class="btn" id="x">Close</button></div>
    <div class="modal-b">${field("Name","n","app-adb")}<label>Workload<select id="w"><option>Transaction Processing</option><option>Data Warehouse</option><option>JSON</option></select></label>
    <div class="two">${field("OCPU","o","1","number")}${field("Storage TB","s","1","number")}</div>${compSelect()}</div>
    <div class="modal-f"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Create</button></div>`);
  $("#x").onclick = $("#cancel").onclick = closeModal;
  $("#go").onclick = () => {
    const name = $("#n").value.trim().toLowerCase();
    if (!/^[a-z][a-z0-9-]{1,28}$/.test(name)) return toast("Name must start with a letter.");
    const d = {id:id("ocid1.autonomousdatabase."), name, workload:$("#w").value, status:"Provisioning", ocpu:+$("#o").value||1, storage:+$("#s").value||1, region:state.region, compartment:$("#comp").value, created:now()};
    state.dbs.unshift(d); closeModal(); render();
    setTimeout(() => {d.status = "Available"; log(name + " database available"); toast(name + " is Available"); render();}, 900);
};
}

function createBucket() {
  openModal(`<div class="modal-h"><h2>Create bucket</h2><div class="sp"></div><button class="btn" id="x">Close</button></div>
    <div class="modal-b">${field("Bucket name","n","logs-archive")}<label>Access<select id="acc"><option>Private</option><option>Public</option></select></label>${compSelect()}</div>
    <div class="modal-f"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Create</button></div>`);
  $("#x").onclick = $("#cancel").onclick = closeModal;
  $("#go").onclick = () => {
    const name = $("#n").value.trim().toLowerCase();
    if (!/^[a-z0-9][a-z0-9.-]{1,40}$/.test(name)) return toast("Use a lowercase bucket name.");
    if (state.buckets.some(b => b.name === name && b.region === state.region)) return toast("Bucket name already used.");
    const b = {id:id("bkt-"), name, region:state.region, compartment:$("#comp").value, access:$("#acc").value, created:now(), objects:[]};
    state.buckets.unshift(b); state.detail = b.id; closeModal(); log("Created bucket " + name); render();
};
}

function createVcn() {
  openModal(`<div class="modal-h"><h2>Create VCN</h2><div class="sp"></div><button class="btn" id="x">Close</button></div>
    <div class="modal-b">${field("Name","n","data-vcn")}${field("IPv4 CIDR","c","10.1.0.0/16")}${compSelect()}</div>
    <div class="modal-f"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Create</button></div>`);
  $("#x").onclick = $("#cancel").onclick = closeModal;
  $("#go").onclick = () => {
    const name = $("#n").value.trim();
    const cidr = $("#c").value.trim();
    if (!/^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$/.test(cidr)) return toast("CIDR looks invalid.");
    const v = {id:id("vcn-"), name, cidr, region:state.region, compartment:$("#comp").value, subnets:[{id:id("sub-"), name:name+"-private", cidr:cidr.replace(/0\/\d+$/, "1.0/24"), access:"Private"}], rules:[]};
    state.vcns.unshift(v); state.detail = v.id; closeModal(); log("Created VCN " + name); render();
};
}

function createUser() {
  openModal(`<div class="modal-h"><h2>Create user</h2><div class="sp"></div><button class="btn" id="x">Close</button></div>
    <div class="modal-b">${field("Username","n","jamie.nguyen")}${field("Email","e","jamie@example.com","email")}
    <label>Groups${state.groups.map(g => `<span class="check"><input type="checkbox" class="g" value="${esc(g.name)}"> ${esc(g.name)}</span>`).join("") || "<span class='k'>Create a group first.</span>"}</label></div>
    <div class="modal-f"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">Create</button></div>`);
  $("#x").onclick = $("#cancel").onclick = closeModal;
  $("#go").onclick = () => {
    const name = $("#n").value.trim().toLowerCase();
    if (!/^[a-z][a-z0-9.]{2,40}$/.test(name)) return toast("Username needs letters and dots.");
    if (state.users.some(u => u.name === name)) return toast("User already exists.");
    const groups = [...document.querySelectorAll(".g:checked")].map(x => x.value);
    state.users.push({id:id("usr-"), name, email:$("#e").value.trim() || name+"@example.com", status:"Active", groups});
    closeModal(); log("Created user " + name); render();
};
}

function bind() {
  const go = view => {state.view = view; state.q = ""; if (view!== "compute" && view!== "network" && view!== "storage") state.detail = null; render();};
  document.querySelectorAll("[data-go]").forEach(el => el.onclick = () => go(el.dataset.go));
  if ($("#region")) $("#region").onchange = e => {state.region = e.target.value; state.detail = null; render();};
  if ($("#q")) $("#q").oninput = e => {state.q = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#q"); if (n) {n.focus(); n.selectionStart = n.selectionEnd = pos;}};
  document.querySelectorAll("[data-kind]").forEach(el => el.onclick = () => {state.detail = el.dataset.id; render();});
  if ($("#newI")) $("#newI").onclick = createInstance;
  if ($("#newDb")) $("#newDb").onclick = createDb;
  if ($("#newB")) $("#newB").onclick = createBucket;
  if ($("#newV")) $("#newV").onclick = createVcn;
  if ($("#newU")) $("#newU").onclick = createUser;
  if ($("#newG")) $("#newG").onclick = () => {
    const name = prompt("Group name", "network-admins");
    if (!name) return;
    if (!/^[a-z][a-z0-9-]{1,30}$/.test(name) || state.groups.some(g => g.name === name)) return toast("Use a unique lowercase group name.");
    state.groups.push({id:id("grp-"), name, desc:"Custom group"}); log("Created group " + name); render();
};
  const inst = state.instances.find(x => x.id === state.detail);
  if ($("#startI")) $("#startI").onclick = () => setStatus(inst, "Starting", "Running");
  if ($("#stopI")) $("#stopI").onclick = () => setStatus(inst, "Stopping", "Stopped");
  if ($("#termI")) $("#termI").onclick = () => {if (!confirm("Terminate " + inst.name + "?")) return; state.instances = state.instances.filter(x => x.id!== inst.id); state.detail = null; log("Terminated " + inst.name); render();};
  document.querySelectorAll("[data-toggle-db]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const d = state.dbs.find(x => x.id === el.dataset.toggleDb);
    setStatus(d, d.status === "Available"? "Stopping": "Starting", d.status === "Available"? "Stopped": "Available");
});
  document.querySelectorAll("[data-bucket]").forEach(el => el.onclick = () => {state.detail = el.dataset.bucket; render();});
  const bucket = state.buckets.find(x => x.id === state.detail);
  if ($("#file")) $("#file").onchange = e => {
    const file = e.target.files[0]; if (!file ||!bucket) return;
    const reader = new FileReader();
    reader.onload = () => {bucket.objects.unshift({name:file.name, size:file.size, type:file.type || "application/octet-stream", data:reader.result, when:now()}); log("Uploaded " + file.name); toast("Uploaded " + file.name); render();};
    reader.readAsDataURL(file);
};
  document.querySelectorAll("[data-dl]").forEach(el => el.onclick = () => {
    const o = bucket.objects[+el.dataset.dl]; const a = document.createElement("a"); a.href = o.data; a.download = o.name; a.click();
});
  document.querySelectorAll("[data-del]").forEach(el => el.onclick = () => {bucket.objects.splice(+el.dataset.del, 1); render();});
  const vcn = state.vcns.find(x => x.id === state.detail);
  if ($("#addSub")) $("#addSub").onclick = () => {
    const n = vcn.subnets.length + 1;
    vcn.subnets.push({id:id("sub-"), name:vcn.name + "-sub-" + n, cidr:"10.0." + n + ".0/24", access:"Private"}); render();
};
  if ($("#addRule")) $("#addRule").onclick = () => {
    const port = prompt("TCP port", "443"); if (!port) return;
    vcn.rules.push({id:id("sl-"), proto:"TCP", port, cidr:"0.0.0.0/0", desc:"Custom"}); log("Ingress rule added"); render();
};
  document.querySelectorAll("[data-rule]").forEach(el => el.onclick = () => {vcn.rules = vcn.rules.filter(r => r.id!== el.dataset.rule); render();});
  document.querySelectorAll("[data-user]").forEach(el => el.onclick = () => {state.users = state.users.filter(u => u.id!== el.dataset.user); render();});
}

function setStatus(obj, mid, end) {
  obj.status = mid; render();
  setTimeout(() => {obj.status = end; log(obj.name + " is " + end); toast(obj.name + " is " + end); render();}, 700);
}

document.querySelectorAll(".nav-btn").forEach(b => b.addEventListener("click", () => {state.view = b.dataset.view; state.detail = null; render();}));
render();
</script>
</body>
</html>
