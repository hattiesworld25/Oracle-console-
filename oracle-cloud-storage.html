<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cloud Console — Object Storage</title>
<style>
:root{--red:#c74634;--ink:#161513;--muted:#6b6560;--line:#e6e2dc;--bg:#f6f5f3;--ok:#1b7a4a;--ok-bg:#e7f6ee;--stop:#8a3a32;--stop-bg:#fdecea;--warn:#9a6700;--warn-bg:#fff6e0;--blue:#1f4e8c}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;grid-template-rows:56px 1fr;grid-template-columns:228px 1fr;grid-template-areas:"top top" "side main"}
header{grid-area:top;background:#1c1917;color:#fff;display:flex;align-items:center;gap:18px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.mark{width:28px;height:28px;border-radius:7px;background:#c74634;display:grid;place-items:center;font-weight:800;font-size:12px}
.crumb{color:#c8c2bb;font-size:13px}.crumb b{color:#fff}.hdr-sp,.sp{flex:1}
.region,.avatar{background:#2c2826;border:1px solid #3d3835;color:#eee;border-radius:8px;padding:6px 10px;font-size:12px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700}
aside{grid-area:side;background:#fff;border-right:1px solid var(--line);padding:14px 10px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 6px}
.nav-btn{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.nav-btn.active,.nav-btn:hover{background:#f4efe9}.nav-btn.active{font-weight:600;box-shadow:inset 3px 0 0 var(--red)}
main{grid-area:main;overflow:auto;padding:22px 28px 48px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:13.5px}
.btn.primary{background:var(--red);border-color:#a33a2b;color:#fff}.btn.danger{color:var(--stop)}
input,select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:10px}.stat{padding:14px 16px}
.k{font-size:12px;color:var(--muted)}.v{font-size:24px;font-weight:700}.panel{overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);padding:10px 14px;background:#faf9f7}
td{padding:12px 14px;border-top:1px solid #f0ece7}
tr.click:hover td{background:#fbf8f5;cursor:pointer}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.stop{background:var(--stop-bg);color:var(--stop)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.linkish{color:var(--blue);font-weight:600;cursor:pointer}
.mono{font-family:ui-monospace,monospace;font-size:12px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:8px 12px;font-size:13.5px}.kv span{color:var(--muted)}
.pad{padding:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-bg{position:fixed;inset:0;background:rgba(22,21,19,.45);display:none;place-items:center;z-index:20;padding:16px}
.modal-bg.show{display:grid}.modal{width:min(640px,100%);background:#fff;border-radius:14px}
.modal-h,.modal-f{padding:16px 18px;display:flex;align-items:center;gap:10px}
.modal-h{border-bottom:1px solid var(--line)}.modal-f{border-top:1px solid var(--line);justify-content:flex-end}
.modal-b{padding:16px 18px;display:grid;gap:12px}label{font-size:12.5px;font-weight:600;display:grid;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:18px;right:18px;background:#1c1917;color:#fff;padding:12px 14px;border-radius:10px;display:none;z-index:30;max-width:360px}
.toast.show{display:block}.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-areas:"top" "main"}aside{display:none}.cards,.grid2,.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">OS</div> Cloud Console</div>
  <div class="crumb">Storage / <b>Buckets</b></div>
  <div class="hdr-sp"></div>
  <div class="region" id="regionLabel">us-ashburn-1</div>
  <div class="avatar">AL</div>
</header>
<aside>
  <div class="nav-label">Storage</div>
  <button class="nav-btn active" data-view="list">Buckets</button>
  <button class="nav-btn" data-view="pars">Pre-authenticated requests</button>
</aside>
<main id="app"></main>
<div class="modal-bg" id="modal"></div>
<div class="toast" id="toast"></div>
<script>
const REGIONS = ["us-ashburn-1", "us-phoenix-1", "eu-frankfurt-1", "uk-london-1"];
const state = {view: "list", region: "us-ashburn-1", selected: null, buckets: [], pars: []};

function nid(p) {return p + Math.random().toString(36).slice(2, 10);}
function now() {return new Date().toISOString();}
function $(s) {return document.querySelector(s);}
function esc(s) {return String(s?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(iso) {return new Date(iso).toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});}
function bytes(n) {
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function pill(text, kind) {
  return `<span class="pill ${kind}"><span class="dot"></span>${esc(text)}</span>`;
}
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2400);
}
function makeBucket(name, access, tier) {
  return {id: nid("ocid1.bucket."), name, access, tier, versioning: false, region: state.region, created: now(), objects: []};
}
function seed() {
  const b = makeBucket("app-assets", "Private", "Standard");
  b.objects.push(
    {name: "readme.txt", size: 42, type: "text/plain", modified: now(), body: "Demo object. This file never left the browser."},
    {name: "logo.svg", size: 186, type: "image/svg+xml", modified: now(), body: "<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><rect width='64' height='64' fill='#c74634'/></svg>"}
);
  state.buckets.push(b);
}
seed();

function render() {
  $("#regionLabel").textContent = state.region;
  document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.view === (state.view === "detail"? "list": state.view)));
  const views = {list: viewList, detail: viewDetail, pars: viewPars};
  $("#app").innerHTML = views[state.view]();
  bind();
}
function table(heads, rows, empty) {
  return `<div class="panel"><table><thead><tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows || `<tr><td class="empty" colspan="${heads.length}">${empty}</td></tr>`}</tbody></table></div>`;
}
function viewList() {
  const list = state.buckets.filter(b => b.region === state.region);
  const objects = list.reduce((n, b) => n + b.objects.length, 0);
  const size = list.reduce((n, b) => n + b.objects.reduce((a, o) => a + o.size, 0), 0);
  const rows = list.map(b => `<tr class="click" data-open="${b.id}"><td class="linkish">${esc(b.name)}</td><td>${pill(b.access, b.access === "Private"? "ok": "warn")}</td><td>${esc(b.tier)}</td><td>${b.objects.length}</td><td>${bytes(b.objects.reduce((a, o) => a + o.size, 0))}</td><td>${fmt(b.created)}</td></tr>`).join("");
  return `<div class="row"><div><h1>Buckets</h1><p class="sub">Simulated object storage in ${state.region}. Files stay in this tab.</p></div><div class="sp"></div><select id="region">${REGIONS.map(r => `<option ${r === state.region? "selected": ""}>${r}</option>`).join("")}</select><button class="btn primary" id="create">Create bucket</button></div>
    <div class="cards"><div class="stat"><div class="k">Buckets</div><div class="v">${list.length}</div></div><div class="stat"><div class="k">Objects</div><div class="v">${objects}</div></div><div class="stat"><div class="k">Stored</div><div class="v">${bytes(size)}</div></div><div class="stat"><div class="k">PARs</div><div class="v">${state.pars.filter(p => p.region === state.region).length}</div></div></div>
    ${table(["Name", "Access", "Tier", "Objects", "Size", "Created"], rows, "No buckets in this region.")}`;
}
function viewDetail() {
  const b = state.buckets.find(x => x.id === state.selected);
  if (!b) {state.view = "list"; return viewList();}
  const rows = b.objects.map(o => `<tr><td class="mono">${esc(o.name)}</td><td>${bytes(o.size)}</td><td>${esc(o.type || "—")}</td><td>${fmt(o.modified)}</td><td><button class="btn" data-dl="${esc(o.name)}">Download</button> <button class="btn danger" data-rm="${esc(o.name)}">Delete</button></td></tr>`).join("");
  return `<div class="row"><button class="btn" id="back">← Buckets</button><div><h1 style="margin:0">${esc(b.name)}</h1><p class="sub" style="margin:2px 0 0">${esc(b.access)} · ${esc(b.tier)}</p></div><div class="sp"></div><button class="btn" id="toggle">${b.versioning? "Disable versioning": "Enable versioning"}</button><button class="btn danger" id="del">Delete bucket</button></div>
    <div class="grid2" style="margin:14px 0"><div class="panel pad"><div class="kv"><span>OCID</span><div class="mono">${b.id}</div><span>Namespace</span><div>demo-tenancy</div><span>Versioning</span><div>${b.versioning? "Enabled": "Disabled"}</div><span>Created</span><div>${fmt(b.created)}</div></div></div>
    <div class="panel pad"><h3 style="margin:0 0 8px">Upload</h3><p class="sub">The file name and a text preview are kept locally. Nothing is sent to a server.</p><input id="file" type="file"><div style="height:10px"></div><button class="btn primary" id="upload">Upload object</button></div></div>
    ${table(["Name", "Size", "Type", "Modified", ""], rows, "This bucket is empty.")}`;
}
function viewPars() {
  const rows = state.pars.filter(p => p.region === state.region).map(p => `<tr><td>${esc(p.bucket)}</td><td>${esc(p.access)}</td><td class="mono">${esc(p.url)}</td><td>${fmt(p.expires)}</td><td><button class="btn danger" data-rm-par="${p.id}">Revoke</button></td></tr>`).join("");
  return `<div class="row"><div><h1>Pre-authenticated requests</h1><p class="sub">Fake links for this demo. They do not open a real bucket.</p></div><div class="sp"></div><button class="btn primary" id="addPar">Create PAR</button></div>${table(["Bucket", "Access", "URL", "Expires", ""], rows, "No requests.")}`;
}
function shell(title, fields, go) {
  return `<div class="modal-h"><h2 style="margin:0">${title}</h2><div class="sp"></div><button class="btn" id="x">Close</button></div><div class="modal-b">${fields}</div><div class="modal-f"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="go">${go}</button></div>`;
}
function openModal(html, onGo) {
  const m = $("#modal");
  m.classList.add("show");
  m.innerHTML = `<div class="modal">${html}</div>`;
  $("#x").onclick = close;
  $("#cancel").onclick = close;
  $("#go").onclick = onGo;
}
function close() {
  $("#modal").classList.remove("show");
  $("#modal").innerHTML = "";
}
function bind() {
  const region = $("#region");
  if (region) region.onchange = e => {state.region = e.target.value; render();};
  const create = $("#create");
  if (create) create.onclick = () => openModal(shell("Create bucket", `<label>Name<input id="n" value="logs-archive"></label><div class="two"><label>Access<select id="access"><option>Private</option><option>Public</option></select></label><label>Tier<select id="tier"><option>Standard</option><option>Infrequent</option><option>Archive</option></select></label></div>`, "Create"), () => {
    const name = $("#n").value.trim().toLowerCase();
    if (!/^[a-z0-9][a-z0-9-]{1,40}$/.test(name)) return toast("Use a lowercase bucket name.");
    if (state.buckets.some(b => b.name === name && b.region === state.region)) return toast("That bucket already exists.");
    state.buckets.unshift(makeBucket(name, $("#access").value, $("#tier").value));
    close();
    toast(name + " created");
    render();
});
  document.querySelectorAll("[data-open]").forEach(el => {el.onclick = () => {state.selected = el.dataset.open; state.view = "detail"; render();};});
  const back = $("#back");
  if (back) back.onclick = () => {state.view = "list"; render();};
  const b = state.buckets.find(x => x.id === state.selected);
  if (b && $("#toggle")) $("#toggle").onclick = () => {b.versioning =!b.versioning; toast(b.versioning? "Versioning on": "Versioning off"); render();};
  if (b && $("#del")) $("#del").onclick = () => {
    if (b.objects.length) return toast("Empty the bucket first.");
    if (!confirm("Delete " + b.name + "?")) return;
    state.buckets = state.buckets.filter(x => x.id!== b.id);
    state.pars = state.pars.filter(p => p.bucket!== b.name);
    state.view = "list";
    toast("Bucket deleted");
    render();
};
  if (b && $("#upload")) $("#upload").onclick = () => {
    const file = $("#file").files[0];
    if (!file) return toast("Choose a file first.");
    if (file.size > 200000) return toast("Demo limit is 200 KB.");
    const reader = new FileReader();
    reader.onload = () => {
      const body = typeof reader.result === "string"? reader.result: "";
      const existing = b.objects.find(o => o.name === file.name);
      const obj = {name: file.name, size: file.size, type: file.type || "application/octet-stream", modified: now(), body};
      if (existing) Object.assign(existing, obj); else b.objects.unshift(obj);
      toast("Uploaded " + file.name);
      render();
};
    reader.readAsText(file);
};
  document.querySelectorAll("[data-dl]").forEach(el => {el.onclick = () => {
    const o = b.objects.find(x => x.name === el.dataset.dl);
    const blob = new Blob([o.body || ""], {type: "text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = o.name;
    a.click();
    URL.revokeObjectURL(a.href);
};});
  document.querySelectorAll("[data-rm]").forEach(el => {el.onclick = () => {b.objects = b.objects.filter(o => o.name!== el.dataset.rm); render();};});
  const addPar = $("#addPar");
  if (addPar) addPar.onclick = () => {
    const names = state.buckets.filter(x => x.region === state.region).map(x => x.name);
    if (!names.length) return toast("Create a bucket first.");
    openModal(shell("Create PAR", `<label>Bucket<select id="bucket">${names.map(n => `<option>${esc(n)}</option>`).join("")}</select></label><label>Access<select id="access"><option>Read</option><option>Write</option><option>Read and write</option></select></label>`, "Create"), () => {
      const bucket = $("#bucket").value;
      const token = Math.random().toString(36).slice(2, 12);
      const expires = new Date(Date.now() + 86400000).toISOString();
      state.pars.unshift({id: nid("par-"), bucket, access: $("#access").value, url: "https://objectstorage.demo.local/p/" + token + "/" + bucket, expires, region: state.region});
      close();
      toast("PAR created. It only exists in this page.");
      render();
});
};
  document.querySelectorAll("[data-rm-par]").forEach(el => {el.onclick = () => {state.pars = state.pars.filter(p => p.id!== el.dataset.rmPar); render();};});
}
document.querySelectorAll(".nav-btn").forEach(btn => btn.addEventListener("click", () => {state.view = btn.dataset.view; render();}));
render();
</script>
</body>
</html>
